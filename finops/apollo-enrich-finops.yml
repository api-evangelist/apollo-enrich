meters:
- name: seats
  description: Per-user subscription seats on an API-enabled plan (Professional and above).
  unit: users
  aggregation: sum
  dimensions:
  - account
  - plan
- name: enrichment_credits
  description: Credits consumed enriching person records (per enriched record returned) and revealing emails.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: mobile_credits
  description: Credits consumed revealing mobile/phone numbers via enrichment reveal flags.
  unit: credits
  aggregation: sum
  dimensions:
  - account
- name: search_page_credits
  description: Credits consumed per page returned by People Search and Organization Search.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: export_credits
  description: Credits consumed exporting or saving records out of Apollo.
  unit: credits
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track credit consumption per endpoint (enrichment vs search) and seat count per plan; use the API usage stats endpoint to monitor request and credit draw-down.
- name: Allocation
  description: Tag API keys or accounts per team/workflow so enrichment and search credits map to internal cost centers.
- name: Optimization
  description: Dedupe and cache resolved contacts before calling /people/match, batch with /people/bulk_match, cap search pagination, and only set reveal flags when personal email/phone is actually needed.
- name: Accountability
  description: Assign owners per API key; review monthly seat count, credit consumption, and plan tier against outreach ROI.
