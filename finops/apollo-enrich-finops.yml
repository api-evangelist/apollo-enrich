description: >-
  FinOps view of Apollo.io spend. Apollo bills on two axes: per-user seats (a
  recurring subscription charge by plan tier) and consumption of Apollo credits
  (email, mobile/phone, and export credits) that data actions draw down. API
  access is only included from the Professional plan up, so the dominant cost
  drivers for an API-integrated deployment are (1) the number of seats on an
  API-enabled plan and (2) enrichment/search credit consumption, since People
  Enrichment consumes credits per enriched record and Organization/People
  Search consume credits per page. Purchasing additional credit packs and
  higher tiers (Organization, Enterprise) are the main levers for scaling spend.
notes: >-
  Per-unit credit prices and monthly credit allowances are not reconciled here;
  verify current seat rates and credit packs at https://www.apollo.io/pricing.
  Cost control centers on minimizing wasted enrichment calls (dedupe before
  matching, cache resolved records) and constraining search pagination.
