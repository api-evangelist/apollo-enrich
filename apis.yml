aid: apollo-enrich
url: https://raw.githubusercontent.com/api-evangelist/apollo-enrich/refs/heads/main/apis.yml
name: Apollo.io
kind: company
description: Apollo.io is a sales intelligence and engagement platform built on a
  B2B database of hundreds of millions of contacts and companies. Its REST API
  exposes People Enrichment (single and bulk match), People Search, Organization
  Enrichment and Search, Contacts and Accounts management, and Sequences
  (emailer campaigns) for outreach - covering contact discovery, data
  enrichment, prospecting, and sales intelligence use cases. The API is
  authenticated with an x-api-key header and is gated behind Apollo's paid
  plans (API access begins on the Professional tier; some endpoints require a
  master API key).
