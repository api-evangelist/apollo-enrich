aid: apollo-enrich
url: https://raw.githubusercontent.com/api-evangelist/apollo-enrich/refs/heads/main/apis.yml
name: Apollo.io
kind: company
description: Apollo.io is a sales intelligence and engagement platform built on a
  B2B database of hundreds of millions of contacts and companies. Its REST API
  exposes People Enrichment (single and bulk match), People Search, Organization
  Enrichment and Search, Contacts and Accounts management, and Sequences
  (emailer campaigns) for outreach - covering contact discovery, data
  enrichment, prospecting, and sales intelligence use cases. The API is
  authenticated with an x-api-key header and is gated behind Apollo's paid
  plans (API access begins on the Professional tier; some endpoints require a
  master API key).
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Contact Discovery
- Data Enrichment
- Sales Intelligence
- B2B Data
- Prospecting
- Web Intelligence
- Lead Generation
- People Search
created: '2026-07-11'
modified: '2026-07-11'
specificationVersion: '0.19'
apis:
- aid: apollo-enrich:apollo-people-enrichment-api
  name: Apollo People Enrichment API
  tags:
  - Contact Discovery
  - Data Enrichment
  - People Enrichment
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.apollo.io/reference/people-enrichment
  baseURL: https://api.apollo.io/api/v1
  properties:
  - url: https://docs.apollo.io/docs/enrich-people-data
    type: Documentation
  - url: https://docs.apollo.io/reference/people-enrichment
    type: APIReference
  - url: openapi/apollo-enrich-openapi.yml
    type: OpenAPI
  - url: collections/apollo-enrich.postman_collection.json
    type: PostmanCollection
  - url: collections/apollo-enrich.opencollection.json
    type: OpenCollection
  description: Enrich a single person (POST /people/match) or up to ten people in
    one call (POST /people/bulk_match) - resolving names, titles, employment,
    verified work emails, and (with reveal flags) personal emails and phone
    numbers. Consumes Apollo credits per enriched record when data is returned.
- aid: apollo-enrich:apollo-people-search-api
  name: Apollo People Search API
  tags:
  - Prospecting
  - Sales Intelligence
  - People Search
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.apollo.io/reference/people-api-search
  baseURL: https://api.apollo.io/api/v1
  properties:
  - url: https://docs.apollo.io/docs/find-people-using-filters
    type: Documentation
  - url: https://docs.apollo.io/reference/people-api-search
    type: APIReference
  - url: openapi/apollo-enrich-openapi.yml
    type: OpenAPI
  - url: collections/apollo-enrich.postman_collection.json
    type: PostmanCollection
  - url: collections/apollo-enrich.opencollection.json
    type: OpenCollection
  description: Find prospects across Apollo's B2B database (POST
    /mixed_people/api_search) with filters for job titles, seniorities,
    locations, company attributes, technologies, and email status. Paginates up
    to 50,000 records (100 per page, up to 500 pages). Requires a master API
    key; does not return emails or phone numbers - pair with enrichment to
    reveal contact details.
- aid: apollo-enrich:apollo-organization-enrichment-api
  name: Apollo Organization Enrichment API
  tags:
  - Data Enrichment
  - Company Data
  - Firmographics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.apollo.io/reference/organization-enrichment
  baseURL: https://api.apollo.io/api/v1
  properties:
  - url: https://docs.apollo.io/reference/organization-enrichment
    type: APIReference
  - url: openapi/apollo-enrich-openapi.yml
    type: OpenAPI
  - url: collections/apollo-enrich.postman_collection.json
    type: PostmanCollection
  - url: collections/apollo-enrich.opencollection.json
    type: OpenCollection
  description: Enrich one company by domain, name, LinkedIn, or website (GET
    /organizations/enrich) or up to ten at once (POST
    /organizations/bulk_enrich), returning firmographics such as industry,
    employee count, revenue, location, and technologies. Company job postings
    are available via a related endpoint.
- aid: apollo-enrich:apollo-organization-search-api
  name: Apollo Organization Search API
  tags:
  - Sales Intelligence
  - B2B Data
  - Company Search
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.apollo.io/reference/organization-search
  baseURL: https://api.apollo.io/api/v1
