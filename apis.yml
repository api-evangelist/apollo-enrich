  - url: openapi/apollo-enrich-openapi.yml
    type: OpenAPI
  - url: collections/apollo-enrich.postman_collection.json
    type: PostmanCollection
  - url: collections/apollo-enrich.opencollection.json
    type: OpenCollection
  description: Search Apollo's company database (POST /mixed_companies/search)
    with filters for domains, employee count, location, revenue, technology
    stack, funding, and active job postings. Paginates up to 50,000 records
    (100 per page, up to 500 pages); consumes credits per page when data is
    returned.
- aid: apollo-enrich:apollo-contacts-api
  name: Apollo Contacts API
  tags:
  - Contacts
  - CRM
  - Contact Discovery
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.apollo.io/reference/search-for-contacts
  baseURL: https://api.apollo.io/api/v1
  properties:
  - url: https://docs.apollo.io/reference/search-for-contacts
    type: APIReference
  - url: openapi/apollo-enrich-openapi.yml
    type: OpenAPI
  - url: collections/apollo-enrich.postman_collection.json
    type: PostmanCollection
  - url: collections/apollo-enrich.opencollection.json
    type: OpenCollection
  description: Manage contacts saved inside your Apollo account - search (POST
    /contacts/search), create (POST /contacts), update (PUT /contacts/{id}),
    and bulk-create contacts, plus list contact stages. Contacts are the people
    you have added to Apollo, distinct from raw database search results.
- aid: apollo-enrich:apollo-accounts-api
  name: Apollo Accounts API
  tags:
  - Accounts
  - CRM
  - B2B Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.apollo.io/reference/search-for-accounts
  baseURL: https://api.apollo.io/api/v1
  properties:
  - url: https://docs.apollo.io/reference/search-for-accounts
    type: APIReference
  - url: openapi/apollo-enrich-openapi.yml
    type: OpenAPI
  - url: collections/apollo-enrich.postman_collection.json
    type: PostmanCollection
  - url: collections/apollo-enrich.opencollection.json
    type: OpenCollection
  description: Manage accounts (companies saved to your Apollo team) - search
    (POST /accounts/search), create (POST /accounts), update (PUT
    /accounts/{id}), and bulk-create accounts. Accounts are the company records
    your team tracks, distinct from the broader organization database.
- aid: apollo-enrich:apollo-sequences-api
  name: Apollo Sequences API
  tags:
  - Sales Engagement
  - Outreach
  - Sequences
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.apollo.io/reference/add-contacts-to-sequence
  baseURL: https://api.apollo.io/api/v1
  properties:
  - url: https://docs.apollo.io/reference/add-contacts-to-sequence
    type: APIReference
  - url: openapi/apollo-enrich-openapi.yml
    type: OpenAPI
  - url: collections/apollo-enrich.postman_collection.json
    type: PostmanCollection
  - url: collections/apollo-enrich.opencollection.json
    type: OpenCollection
  description: Drive multi-step outreach through Apollo sequences (emailer
    campaigns) - create and search sequences and add contacts to a sequence
    (POST /emailer_campaigns/{id}/add_contact_ids), plus draft, send, and search
    outreach emails. Turns discovered and enriched contacts into active
    engagement.
